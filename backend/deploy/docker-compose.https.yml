services:
  caddy:
    image: caddy:2-alpine
    container_name: taskflow-caddy
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
