services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/taskflow.db"
    ports:
      - "8000:8000"
    volumes:
      - taskflow_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  taskflow_data:
